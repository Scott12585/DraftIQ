<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DraftIQ</title>
<style>
:root{--bg:#08111f;--card:#111d30;--card2:#17263d;--line:#2a3b58;--text:#f4f7fb;--muted:#9fb0c7;--green:#42d392;--red:#ff6b6b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif}header{position:sticky;top:0;z-index:5;background:#091322f3;padding:13px;border-bottom:1px solid var(--line)}h1{margin:0;font-size:22px}.m{color:var(--muted)}nav{display:flex;gap:7px;overflow:auto;margin-top:10px}button,select,input{background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:9px;font-weight:700}button{cursor:pointer}button.on,button.go{background:var(--green);color:#06120d;border-color:var(--green)}button.red{background:#3a2026;color:#ffdfe2}main{max-width:1250px;margin:auto;padding:15px}.grid{display:grid;grid-template-columns:1.25fr .75fr;gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px;margin-bottom:12px}.hero{background:linear-gradient(135deg,#123029,#122139)}.hero h2{font-size:28px;margin:9px 0}.big{font-size:42px;color:var(--green);font-weight:900}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:7px;background:#0c1626;border:1px solid var(--line);border-radius:10px;padding:10px}.pill{display:inline-block;background:#263753;border-radius:99px;padding:3px 8px;font-size:12px}.notice{background:#17263b;border:1px solid var(--line);border-radius:9px;padding:10px;margin-bottom:10px}.filters,.trade{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px;margin-bottom:10px}.mini{font-size:12px}.targeted{border-color:var(--green)!important;background:#10251f!important}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}th{color:var(--muted)}.keeper{background:#261f36}.mine{background:#10251f}.roundhead{background:#1a2c45;font-weight:800}@media(max-width:800px){.grid{grid-template-columns:1fr}.filters,.trade{grid-template-columns:1fr}main{padding:10px}.row{align-items:flex-start}}
</style>
</head>
<body>
<header><h1>🏈 DraftIQ <span class="m" id="status">Loading…</span></h1><nav id="nav"></nav></header>
<main id="app"><div class="card">Loading DraftIQ…</div></main>
<script src="players.js?v=4"></script>
<script>
try{const k='draftiq_v6',x=JSON.parse(localStorage.getItem(k)||'null');if(x){x.owners=x.owners||{};if(!Object.prototype.hasOwnProperty.call(x.owners,'29'))x.owners[29]='Traded Away';localStorage.setItem(k,JSON.stringify(x));}}catch(e){}
</script>
<script src="app.js?v=4"></script>
</body>
</html>
