<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DraftIQ</title><style>body{margin:0;background:#08111f;color:#f4f7fb;font:15px system-ui}header{position:sticky;top:0;background:#091322ee;padding:13px;border-bottom:1px solid #2a3b58;z-index:3}h1{margin:0;font-size:22px}.m{color:#9fb0c7}nav{display:flex;gap:7px;overflow:auto;margin-top:10px}button,select,input{background:#17263d;color:#f4f7fb;border:1px solid #2a3b58;border-radius:9px;padding:9px;font-weight:700}button{cursor:pointer}button.on,button.go{background:#42d392;color:#06120d}button.red{background:#3a2026;color:#ffdfe2}main{max-width:1250px;margin:auto;padding:15px}.grid{display:grid;grid-template-columns:1.25fr .75fr;gap:14px}.card{background:#111d30;border:1px solid #2a3b58;border-radius:15px;padding:15px;margin-bottom:12px}.hero{background:linear-gradient(135deg,#123029,#122139)}.big{font-size:42px;color:#42d392;font-weight:900}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:7px;background:#0c1626;border:1px solid #2a3b58;border-radius:10px;padding:10px}.pill{display:inline-block;background:#263753;border-radius:99px;padding:3px 8px;font-size:12px}.notice{background:#17263b;border:1px solid #2a3b58;border-radius:9px;padding:10px;margin-bottom:10px}.filters{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px;margin-bottom:10px}.mini{font-size:12px}.targeted{border-color:#42d392!important;background:#10251f!important}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #2a3b58;text-align:left;font-size:13px}th{color:#9fb0c7}.keeper{background:#261f36}.mine{background:#10251f}.roundhead{background:#1a2c45;font-weight:800}@media(max-width:800px){.grid{grid-template-columns:1fr}.filters{grid-template-columns:1fr 1fr}main{padding:10px}}</style></head><body><header><h1>🏈 DraftIQ <span class="m" id="status">Pre-Draft</span></h1><nav id="nav"></nav></header><main id="app"></main><script>
const TEAMS=['Scott','Brandon','Phillip','Andy','Hunter','Dave','Cody','Chris','Brian','Sean'],KEY='draftiq_v6';const proj=[['Josh Allen','QB',1,3817.1,27.4,11.2,586,11.8,0,0,0,4.1],['Lamar Jackson','QB',2,3652.5,28.3,9.6,639.7,3.2,0,0,0,4.2],['Drake Maye','QB',3,4026.7,28,10.4,493,3.7,0,0,0,5.6],['Jayden Daniels','QB',4,3681.6,23.8,11,685.3,4.7,0,0,0,2.8],['Jalen Hurts','QB',5,3569.9,24.2,7.4,461.3,8.4,0,0,0,4],['Joe Burrow','QB',6,4175,33.3,11.6,178.6,1.4,0,0,0,1.9],['Jaxson Dart','QB',7,3591.5,22.3,11.1,549.1,6.5,0,0,0,2.9],['Brock Purdy','QB',8,4157.9,27.7,14.3,304.1,3.8,0,0,0,4.3],['Trevor Lawrence','QB',9,3908.5,27,13,321.9,4.9,0,0,0,3.4],['Dak Prescott','QB',10,4291.9,30.9,11.3,173.4,1.7,0,0,0,2.8],['Jahmyr Gibbs','RB',1,0,0,0,1381.2,13.8,71.3,580.6,4.1,1.1],['Bijan Robinson','RB',2,0,0,0,1426.1,9.5,79.3,735.9,3.5,1.8],['Christian McCaffrey','RB',3,0,0,0,1093.6,8.7,78.4,694,4.6,1.1],['Jonathan Taylor','RB',4,0,0,0,1504.6,12.9,42.9,341.5,1.5,1.7],['De\'Von Achane','RB',5,0,0,0,1199.8,6,65.3,490.7,4,1],['Chase Brown','RB',6,0,0,0,1036.8,7.8,63.8,427.6,4,1.1],['Ashton Jeanty','RB',7,0,0,0,1105.2,8,58.7,414.6,3.3,1.1],['Derrick Henry','RB',8,0,0,0,1568.5,13.4,18.1,175.1,.7,1.7],['James Cook','RB',9,0,0,0,1404.7,10.3,33.3,283.7,1.9,2.4],['Saquon Barkley','RB',10,0,0,0,1299.1,8.2,41.7,330.4,2.1,1],['Puka Nacua','WR',1,0,0,0,85,1.4,117,1539,9,1],['Ja\'Marr Chase','WR',2,0,0,0,17,0,121.1,1509.4,10.6,1],['Jaxon Smith-Njigba','WR',3,0,0,0,30.4,.1,110.9,1569.7,9.2,1.1],['Amon-Ra St. Brown','WR',4,0,0,0,11.8,0,117.4,1390.4,10.5,.4],['Drake London','WR',5,0,0,0,0,0,101.7,1328.2,9.4,1],['CeeDee Lamb','WR',6,0,0,0,12.5,0,97.6,1296.6,7.5,.3],['Rashee Rice','WR',7,0,0,0,25.5,.9,99.1,1099.7,9.7,.6],['Justin Jefferson','WR',8,0,0,0,5.5,0,98.6,1310.9,7.1,.3],['George Pickens','WR',9,0,0,0,-.3,0,82.6,1201.4,8.4,.5],['A.J. Brown','WR',10,0,0,0,0,0,87.7,1222,7.6,.3],['Trey McBride','TE',1,0,0,0,0,0,108.9,1050.8,6.8,.2],['Brock Bowers','TE',2,0,0,0,0,0,97,1022.9,7.5,.2],['Colston Lo const initialTeams=[['Scott','Josh Allen','Jahmyr Gibbs','Justin Jefferson','Ashton Jeanty'],['Brandon','Jaxson Dart','Bijan Robinson','Amon-Ra St. Brown','Jaxon Smith-Njigba'],['Phillip','Joe Burrow',"De'Von Achane",'Ja\'Marr Chase','Puka Nacua'],['Andy','Jalen Hurts','Saquon Barkley','Jonathan Taylor','Nico Collins'],['Hunter','','','',''],['Dave','','','',''],['Cody','','','',''],['Chris','','','',''],['Brian','','','',''],['Sean','','','','']];const initial={teams:initialTeams,players:proj.map(x=>x[0]),draft:[],targets:[],pick:1,owners:{1:'Scott',9:'Scott',19:'Scott',39:'Scott',49:'Scott',59:'Scott'}};let s=JSON.parse(localStorage.getItem(KEY)||'null')||initial;s.owners=s.owners||initial.owners;s.targets=s.targets||[];s.draft=s.draft||[];save();const $=id=>document.getElementById(id),E=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(KEY,JSON.stringify(s))}function pdata(n){return proj.find(x=>x[0]===n)}function owner(p){return s.owners[p]||TEAMS[(p-1)%10]}function rnd(p){return Math.ceil(p/10)}function keeperAt(p){if(rnd(p)<13)return null;let t=(s.teams.find(x=>x[0]===owner(p))||[]).slice(1).filter(Boolean);return t[rnd(p)-13]||null}function taken(){let z=new Set(s.draft.map(x=>x.name));s.teams.forEach(t=>t.slice(1).filter(Boolean).forEach(n=>z.add(n)));return z}function available(){let z=taken();return proj.filter(p=>!z.has(p[0]))}function pts(p){return p[3]/25+p[4]*6-p[5]+p[6]/10+p[7]*6+p[8]+p[9]/10+p[10]*6-p[11]*2}function my(){return s.teams[0].slice(1).filter(Boolean).map(n=>({name:n,pos:pdata(n)?.[1],keeper:true})).concat(s.draft.filter(x=>x.team==='Scott').map(x=>({name:x.name,pos:x.pos})))}function need(pos){let n=my().filter(x=>x.pos===pos).length;return pos==='QB'?(n?10:75):pos==='RB'?Math.max(15,90-n*25):pos==='WR'?Math.max(15,92-n*22):pos==='TE'?(n?25:60):30}function nextMine(){for(let i=s.pick+1;i<=120;i++)if(owner(i)==='Scott'&&rnd(i)<=12)return i}function survival(p){let n=nextMine()||120,stronger=available().filter(x=>pts(x)>pts(p)).length;return Math.max(5,Math.min(97,100-stronger*6-Math.max(0,n-s.pick)*1.5))}function lvl(n){return s.targets.find(t=>t.name===n)?.level||0}function score(p){let a=available(),mx=Math.max(...a.map(pts),1);return Math.min(100,pts(p)/mx*65+need(p[1])*.25+(100-survival(p))*.1+lvl(p[0])*7)}function rec(){return available().map(p=>({p,pts:pts(p),surv:survival(p),score:score(p)})).sort((a,b)=>b.score-a.score)}const pages=[['draft','Draft'],['board','Board'],['players','Available'],['targets','Targets'],['roster','My Roster'],['league','Keepers']];function nav(v){$('nav').innerHTML=pages.map(x=>`<button class="${v===x[0]?'on':''}" onclick="view('${x[0]}')">${x[1]}</button>`).join('')}function view(v){nav(v);$('status').textContent=`• Pick ${s.pick}/120 • ${owner(s.pick)}`;$('app').innerHTML=v==='draft'?draft():v==='board'?board():v==='players'?players():v==='targets'?targets():v==='roster'?roster():league();if(v==='players')filterPlayers()}function draft(){let r=rec(),b=r[0];return `<div class="grid"><section><div class="card hero"><div class="m">CURRENT PICK ${s.pick}/120 • ${owner(s.pick)} • ROUND ${rnd(s.pick)}</div><h2>${b?E(b.p[0]):'No players available'}</h2>${b?`<span class="pill">${b.p[1]} • 2026 projected ${b.pts.toFixed(1)} pts</span><div class="big">${b.score.toFixed(0)}</div><div class="m">DRAFTIQ SCORE</div><p>${b.surv<35?'⚠️ '+b.surv+'% chance to survive your next pick.':need(b.p[1])>70?'High roster need plus strong value.':'Best blend of projection, roster fit and urgency.'}</p><button class="go" onclick="draftPlayer('${E(b.p[0])}')">DRAFT PLAYER</button>`:'<div class="notice">No verified projection remains.</div>'}</div><div class="card"><h3>🔥 Suggested Players</h3>${r.slice(0,8).map(x=>`<div class="row"><span><b>${E(x.p[0])}</b><br><span class="m mini">${x.p[1]} • ${x.pts.toFixed(1)} pts • ${x.surv}% next</span></span><b>${x.score.toFixed(0)}</b></div>`).join('')}</div></section><aside><div class="card"><h3>🔮 Around Next Pick</h3>${r.slice().sort((a,b)=>b.surv-a.surv).slice(0,5).map(x=>`<div class="row"><span>${E(x.p[0])}<br><span class="m mini">${x.p[1]} • ${x.pts.toFixed(1)} pts</span></span><b>${x.surv}%</b></div>`).join('')}</div><div class="card"><h3>🎯 Targets</h3>${s.targets.map(t=>`<div class="row"><span>${E(t.name)}<br><small>${['','Watch','Target','Must Have'][t.level]}</small></span></div>`).join('')||'<span class="m">None yet.</span>'}</div></aside></div>`}function draftPlayer(n){let p=pdata(n);if(!p||rnd(s.pick)>12)return;s.draft.push({pick:s.pick,team:owner(s.pick),name:n,pos:p[1]});let p2=s.pick+1;while(p2<=120&&rnd(p2)>12)p2++;s.pick=Math.min(121,p2);save();view('draft')}function board(){let rows='';for(let r=1;r<=16;r++){rows+=`<tr><td colspan="3"><b>ROUND ${r}${r>=13?' — KEEPER ROUND':''}</b></td></tr>`;for(let j=1;j<=10;j++){let p=(r-1)*10+j,d=s.draft.find(x=>x.pick===p),k=keeperAt(p);rows+=`<tr class="${r>=13?'keeper ':''}${owner(p)==='Scott'?'mine':''}"><td>${r}.${String(j).padStart(2,'0')}</td><td>${E(owner(p))}</td><td>${k?E(k)+' <span class="pill">KEEPER</span>':d?E(d.name):'—'}</td></tr>`}}return `<div class="card"><h2>📋 16-Round Draft Board</h2><div class="notice"><b>Rounds 1–12:</b> live draft. <b>Rounds 13–16:</b> keepers. Scott owns 1.01, 1.09, 2.09 and 4.09–12.09. Scott does not own 3.09.</div><table><tr><th>Pick</th><th>Owner</th><th>Player</th></tr>${rows}</table></div>`}function players(){return `<div class="card"><h2>Available Players</h2><div class="notice">Sorting and targets update automatically as keepers and picks change.</div><div class="filters"><input id="q" placeholder="Search player..." oninput="filterPlayers()"><select id="pos" onchange="filterPlayers()"><option value="">All positions</option><option>QB</option><option>RB</option><option>WR</option><option>TE</option></select><select id="sort" onchange="filterPlayers()"><option value="score">DraftIQ Score</option><option value="pts">2026 Projected Points</option><option value="rank">ADP / Rank</option><option value="pos">Position</option><option value="target">Target Priority</option><option value="surv">Chance to Reach Next Pick</option></select></div><div id="plist"></div></div>`}function filterPlayers(){if(!$('plist'))return;let q=($('q')?.value||'').toLowerCase(),po=$('pos')?.value||'',so=$('sort')?.value||'score',a=rec().filter(x=>(!q||x.p[0].toLowerCase().includes(q))&&(!po||x.p[1]===po));a.sort((x,y)=>so==='pts'?y.pts-x.pts:so==='rank'?x.p[2]-y.p[2]:so==='pos'?x.p[1].localeCompare(y.p[1])||x.p[2]-y.p[2]:so==='target'?lvl(y.p[0])-lvl(x.p[0])||y.score-x.score:so==='surv'?y.surv-x.surv:y.score-x.score);$('plist').innerHTML=a.map(x=>`<div class="row ${lvl(x.p[0])?'targeted':''}"><span><b>${E(x.p[0])}</b> <span class="pill">${x.p[1]}</span><br><span class="m mini">2026: ${x.pts.toFixed(1)} pts • Score ${x.score.toFixed(0)} • ${x.surv}% next</span></span><span>${lvl(x.p[0])?`<button onclick="removeTarget('${E(x.p[0])}')">✓ Targeted</button>`:`<button onclick="addTarget('${E(x.p[0])}',1)">＋ Target</button>`}</span></div>`).join('')||'<div class="notice">No matching available players.</div>'}function targets(){return `<div class="grid"><div class="card"><h2>🎯 My Targets</h2>${s.targets.length?s.targets.map(t=>`<div class="row"><span><b>${E(t.name)}</b><br><small>${['','Watch','Target','Must Have'][t.level]}</small></span><span><button onclick="cycleTarget('${E(t.name)}')">Change</button> <button class="red" onclick="removeTarget('${E(t.name)}')">Remove</button></span></div>`).join(''):'<span class="m">No targets yet.</span>'}</div><div class="card"><h3>Add Target</h3><select id="tp">${available().map(p=>`<option>${E(p[0])}</option>`).join('')}</select><select id="tl" style="margin-top:8px"><option value="1">Watch</option><option value="2">Target</option><option value="3">Must Have</option></select><button class="go" style="margin-top:8px" onclick="addTarget($('tp').value,+$('tl').value)">Add Target</button></div></div>`}function addTarget(n,l){if(!n)return;s.targets=s.targets.filter(t=>t.name!==n);s.targets.push({name:n,level:l||1});save();view('targets')}function removeTarget(n){s.targets=s.targets.filter(t=>t.name!==n);save();view('players')}function cycleTarget(n){let t=s.targets.find(x=>x.name===n);if(!t)return;t.level=t.level>=3?1:t.level+1;save();view('targets')}function roster(){return `<div class="grid"><div class="card"><h2>👤 My Roster</h2>${my().map(x=>`<div class="row"><span><b>${E(x.name)}</b><br><small class="m">${x.pos||''}</small></span><span class="pill">${x.keeper?'KEEPER':'DRAFT'}</span></div>`).join('')}</div><div class="card"><h3>Keeper Rounds</h3><div class="notice">Your four keepers automatically occupy Rounds 13, 14, 15 and 16. They are excluded from the live draft pool.</div></div></div>`}function league(){return `<div class="card"><h2>👥 Keepers</h2><div class="notice">Enter each team's four keepers. They automatically disappear from Available and appear in that team's Round 13–16 slots. <b>Your existing keeper entries are preserved.</b></div><table><tr><th>Team</th><th>Keeper 1<br>R13</th><th>Keeper 2<br>R14</th><th>Keeper 3<br>R15</th><th>Keeper 4<br>R16</th></tr>${s.teams.map((t,i)=>`<tr><td><b>${E(t[0])}</b></td>${[1,2,3,4].map(j=>`<td><input value="${E(t[j]||'')}" onchange="keeper(${i},${j},this.value)"></td>`).join('')}</tr>`).join('')}</table></div>`}function keeper(i,j,v){s.teams[i][j]=v.trim();save();view('league')}view('draft');</script></body></html>
