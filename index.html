<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080808">
<title>Red Zone DraftIQ</title>
<style>
:root{--bg:#080808;--sidebar:#0d0d0e;--panel:#111214;--panel2:#17181b;--line:#2b2d31;--text:#f5f5f5;--muted:#9b9da3;--red:#e21b23;--red2:#a70e14;--green:#39d353;--orange:#ff9d2e;--blue:#54b8ff;--purple:#d487ff}
*{box-sizing:border-box}html,body{min-height:100%}body{margin:0;background:radial-gradient(circle at 65% -10%,#1a0b0c 0,#080808 36%);color:var(--text);font:14px Inter,system-ui,-apple-system,Segoe UI,sans-serif}
header{position:fixed;left:0;top:0;bottom:0;width:236px;z-index:20;background:linear-gradient(180deg,#101011,#0a0a0b);border-right:1px solid #242529;padding:22px 16px;display:flex;flex-direction:column;overflow:auto}
.brand{text-align:center;padding-bottom:20px;border-bottom:1px solid #25262a;margin-bottom:16px}.brand-logo{width:154px;height:154px;filter:drop-shadow(0 7px 18px #000)}.brand-title{font-size:27px;font-weight:950;letter-spacing:1.5px;color:var(--red);line-height:1}.brand-sub{font-size:12px;letter-spacing:2.3px;font-weight:800;margin-top:7px}
h1{margin:0}#status{display:block;margin-top:16px;padding:12px;border:1px solid #302326;border-radius:11px;background:#120d0e;color:#ddd;font-size:12px;line-height:1.5}
nav{display:flex;flex-direction:column;gap:5px;margin-top:0}nav button{width:100%;text-align:left;background:transparent;border:0;border-left:3px solid transparent;border-radius:5px;color:#bcbec4;padding:12px 13px;font-size:14px}nav button:hover{background:#151517;color:#fff}nav button.on{background:linear-gradient(90deg,#241011,#151516);border-left-color:var(--red);color:#fff}
button,select,input{font:inherit}button,select,input{background:#141518;color:#eee;border:1px solid #34363b;border-radius:7px;padding:9px 11px}button{cursor:pointer;font-weight:750}button:hover{border-color:#5a5d63}button.go{background:var(--red);border-color:var(--red);color:white}button.red{background:#331316;color:#ffb1b5;border-color:#632128}button:disabled{opacity:.42;cursor:not-allowed}
main{margin-left:236px;max-width:none;padding:26px 28px 50px;min-height:100vh}main:before{content:'RED ZONE';display:block;color:var(--red);font-size:34px;line-height:1;font-weight:950;letter-spacing:1.3px;margin:2px 0 6px}main:after{content:'FANTASY DRAFT';position:absolute;top:62px;left:264px;letter-spacing:3px;font-size:11px;font-weight:800;color:#fff}
.grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(290px,.85fr);gap:14px;margin-top:32px}.card{background:linear-gradient(180deg,#121315,#0f1012);border:1px solid #303238;border-radius:9px;padding:16px;margin-bottom:14px;box-shadow:0 10px 30px rgba(0,0,0,.18)}.card h2,.card h3{margin:0 0 12px;text-transform:uppercase;letter-spacing:.4px}.card h2{font-size:18px}.card h3{font-size:14px}.card h2:after,.card h3:after{content:'';display:block;width:38px;height:2px;background:var(--red);margin-top:8px}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#171214,#101112)}.hero:before{content:'';position:absolute;inset:0 auto 0 0;width:4px;background:var(--red)}.hero h2{font-size:31px;text-transform:none}.big{font-size:44px;color:var(--red);font-weight:950;line-height:1}.m{color:var(--muted)}.mini{font-size:12px}.pill{display:inline-block;border:1px solid #3b3c41;background:#18191c;border-radius:20px;padding:4px 8px;font-size:11px;color:#ddd}
.notice{background:#100d0e;border:1px solid #392024;border-left:3px solid var(--red);border-radius:6px;padding:10px 12px;margin-bottom:12px;color:#c7c7ca;font-size:12px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 11px;margin-top:6px;background:#101113;border:1px solid #25272b;border-radius:6px}.row:hover{background:#141519;border-color:#383b40}.targeted{border-color:#17692b!important;box-shadow:inset 3px 0 0 #27c447;background:#101712!important}
.filters,.trade{display:grid;grid-template-columns:1.35fr .8fr .9fr;gap:8px;margin-bottom:12px}input:focus,select:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 2px rgba(226,27,35,.12)}
table{width:100%;border-collapse:collapse;background:#0f1012;border:1px solid #292b30;border-radius:8px;overflow:hidden}th{color:#a7a9ae;text-transform:uppercase;font-size:11px;letter-spacing:.5px;background:#141518}th,td{padding:9px;border-bottom:1px solid #292b30;text-align:left;font-size:12px}tr:last-child td{border-bottom:0}.roundhead td{background:#1a1012;color:#fff;border-top:1px solid #4b191d;border-bottom:1px solid #4b191d;font-weight:900;letter-spacing:.5px}.keeper{background:#151119}.mine{background:linear-gradient(90deg,#501216,#241013)!important}.mine td{border-bottom-color:#632027}
.row .pill{font-weight:900}.row .pill:first-letter{color:var(--red)}
@media(max-width:900px){header{position:sticky;top:0;width:100%;height:auto;bottom:auto;padding:10px 12px;display:block;overflow:visible}.brand{display:flex;align-items:center;text-align:left;padding:0 0 8px;margin-bottom:8px;gap:10px}.brand-logo{width:58px;height:58px}.brand-title{font-size:22px}.brand-sub{font-size:9px}#status{position:absolute;right:10px;top:8px;margin:0;max-width:145px;padding:8px;font-size:10px}nav{flex-direction:row;overflow-x:auto;gap:5px;padding-bottom:2px}nav button{width:auto;white-space:nowrap;padding:8px 10px;border-left:0;border-bottom:2px solid transparent}nav button.on{border-left:0;border-bottom-color:var(--red)}main{margin-left:0;padding:16px 10px 36px}main:before{font-size:25px;margin-top:4px}main:after{display:none}.grid{grid-template-columns:1fr;margin-top:16px}.filters,.trade{grid-template-columns:1fr}.card{padding:12px}table{display:block;overflow-x:auto;white-space:nowrap}}
</style>
</head>
<body>
<header>
  <div class="brand"><svg class="brand-logo" viewBox="0 0 180 180" role="img" aria-label="Red Zone logo"><path d="M90 8 159 40v76l-69 56-69-56V40Z" fill="#0c0c0d" stroke="#e8dfbf" stroke-width="7"/><path d="M90 20 147 47v61l-57 47-57-47V47Z" fill="none" stroke="#d71920" stroke-width="7"/><g transform="rotate(-22 90 58)"><ellipse cx="90" cy="58" rx="45" ry="25" fill="#9a421d" stroke="#111" stroke-width="5"/><path d="M65 58h50M76 48v20M86 45v26M96 45v26M106 48v20" stroke="#eee3bd" stroke-width="4" stroke-linecap="round"/></g><rect x="16" y="92" width="148" height="43" rx="4" fill="#0b0b0c"/><text x="90" y="124" text-anchor="middle" fill="#e31b23" font-family="Impact,Arial Black,sans-serif" font-size="37" font-weight="900" letter-spacing="1">RED ZONE</text></svg><div><div class="brand-title">RED ZONE</div><div class="brand-sub">FANTASY DRAFT</div></div></div>
  <h1><span class="m" id="status">Loading…</span></h1>
  <nav id="nav"></nav>
</header>
<main id="app"><div class="card">Loading Red Zone DraftIQ…</div></main>
<script src="players.js?v=4"></script>
<script src="app.js?v=7"></script>
</body>
</html>
