<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DraftIQ</title><style>:root{--bg:#09111f;--p:#121d30;--p2:#192840;--t:#f3f7ff;--m:#9fb0c8;--a:#42d392;--w:#ffd166;--d:#ff6b6b;--l:#2a3a55}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px system-ui,-apple-system,Segoe UI,sans-serif}header{position:sticky;top:0;z-index:5;background:#0b1424ee;border-bottom:1px solid var(--l);padding:14px}h1{margin:0;font-size:22px}small,.m{color:var(--m)}nav{display:flex;gap:7px;overflow:auto;margin-top:12px}button{border:1px solid var(--l);background:var(--p2);color:var(--t);padding:9px 12px;border-radius:9px;cursor:pointer}button.on,button.go{background:var(--a);color:#07120d;font-weight:800;border-color:var(--a)}button.red{background:#3a2026;color:#ffd7db}main{max-width:1250px;margin:auto;padding:15px}.g{display:grid;grid-template-columns:1.25fr .8fr;gap:14px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{background:var(--p);border:1px solid var(--l);border-radius:15px;padding:15px;margin-bottom:12px}.hero{background:linear-gradient(135deg,#142d2a,#121f32);border-color:#315b4c}.hero h2{font-size:28px;margin:5px 0}.score{font-size:38px;color:var(--a);font-weight:900}.stat{background:#0e1727;border:1px solid var(--l);border-radius:10px;padding:10px}.stat b{display:block;font-size:20px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px;border:1px solid var(--l);border-radius:10px;background:#0e1727;margin-top:7px}.pill{font-size:12px;padding:3px 7px;border-radius:99px;background:#263754}.good{color:var(--a)}.warn{color:var(--w)}.bad{color:var(--d)}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid var(--l);text-align:left;font-size:13px}th{color:var(--m)}input,select,textarea{background:#0d1727;color:var(--t);border:1px solid var(--l);border-radius:8px;padding:9px;width:100%}.filters{display:flex;gap:8px;margin-bottom:10px}.filters>*{flex:1}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.notice{padding:10px;background:#17263b;border:1px solid var(--l);border-radius:9px;color:#cbd8ea}@media(max-width:800px){.g,.g3{grid-template-columns:1fr}.filters{flex-wrap:wrap}.filters>*{min-width:45%}main{padding:10px}.hero h2{font-size:23px}}</style></head><body><header><h1>🏈 DraftIQ <small id="status">Pre-Draft</small></h1><nav id="nav"></nav></header><main id="app"></main><script>
const K='draftiq_cloud_v1';const base={teams:[['Scott','Josh Allen','Jahmyr Gibbs','Justin Jefferson','Ashton Jeanty'],['Brandon','Jaxson Dart','Bijan Robinson','Amon-Ra St. Brown','Jaxon Smith-Njigba'],['Phillip','Joe Burrow',"De'Von Achane",'Ja\'Mar Chase','Puka Nacua'],['Andy','Jalen Hurts','Saquon Barkley','Jonathan Taylor','Nico Collins'],['Hunter','','','',''],['Dave','','','',''],['Cody','','','',''],['Chris','','','',''],['Brian','','','',''],['Sean','','','','']],players:[['Ja\'Marr Chase','WR',1],['Jahmyr Gibbs','RB',2],['Puka Nacua','WR',3],['Bijan Robinson','RB',4],['Jaxon Smith-Njigba','WR',5],['Amon-Ra St. Brown','WR',6],['Christian McCaffrey','RB',7],['Jonathan Taylor','RB',8],['Drake London','WR',9],['De\'Von Achane','RB',10],['CeeDee Lamb','WR',11],['Justin Jefferson','WR',12],['Rashee Rice','WR',13],['Chase Brown','RB',14],['James Cook','RB',15],['Ashton Jeanty','RB',16],['Omarion Hampton','RB',17],['Derrick Henry','RB',18],['Malik Nabers','WR',19],['Nico Collins','WR',20],['Saquon Barkley','RB',21],['Breece Hall','RB',22],['Ladd McConkey','WR',23],['A.J. Brown','WR',24],['Trey McBride','TE',25],['Brock Bowers','TE',26],['Sam LaPorta','TE',27],['Jayden Daniels','QB',28],['Lamar Jackson','QB',29],['Joe Burrow','QB',30],['Jalen Hurts','QB',31],['Drake Maye','QB',32],['Josh Allen','QB',36],['Jayden Reed','WR',39],['Chris Olave','WR',40],['Terry McLaurin','WR',41],['George Pickens','WR',42],['DK Metcalf','WR',43],['Kenneth Walker III','RB',45],['James Conner','RB',46],['Bucky Irving','RB',48],['Mark Andrews','TE',53],['George Kittle','TE',54],['Baker Mayfield','QB',57],['Bo Nix','QB',58],['Jared Goff','QB',59],['Justin Fields','QB',60]],draft:[],targets:[],pick:1};let s=JSON.parse(localStorage.getItem(K)||'null')||base;save();
const pages=[['draft','Draft'],['board','Board'],['players','Available'],['targets','Targets'],['roster','My Roster'],['teams','Teams']];const $=x=>document.getElementById(x), esc=x=>String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(K,JSON.stringify(s))}function team(p){return s.teams[(p-1)%10][0]}function taken(){return new Set([...s.teams.flatMap(t=>t.slice(1).filter(Boolean)),...s.draft.map(x=>x.name)])}function avail(){let t=taken();return s.players.filter(x=>!t.has(x[0]))}function my(){let a=s.teams[0].slice(1).filter(Boolean).map(x=>({name:x,keeper:true}));s.draft.filter(x=>x.team==='Scott').forEach(x=>a.push({name:x.name,pos:x.pos}));return a}function need(pos){let r=my(),n=r.filter(x=>x.pos===pos).length;if(pos==='QB')return n?10:80;if(pos==='RB')return Math.max(15,85-n*25);if(pos==='WR')return Math.max(15,90-n*22);if(pos==='TE')return 60;return 30}function surv(p){let gap=(()=>{for(let i=s.pick+1;i<=60;i++)if(team(i)==='Scott')return i-s.pick;return 99})();let stronger=avail().filter(x=>x[2]<p[2]).length;return Math.max(5,Math.min(95,100-stronger*7-gap*2-(p[2]<15?15:0)))}function score(p){let target=(s.targets.find(x=>x.name===p[0])||{}).level||0;return Math.max(0,Math.min(100,100-p[2]*1.05+need(p[1])*.32+target*8+(100-surv(p))*.2))}function rec(){return avail().map(p=>({p,score:score(p),surv:surv(p)})).sort((a,b)=>b.score-a.score)}function nav(v){$('nav').innerHTML=pages.map(x=>`<button class="${v===x[0]?'on':''}" onclick="view('${x[0]}')">${x[1]}</button>`).join('')}function view(v){nav(v);$('status').textContent='• Pick '+s.pick+' • '+team(s.pick);$('app').innerHTML=v==='draft'?draft():v==='board'?board():v==='players'?players():v==='targets'?targets():v==='roster'?roster():teams()}function draft(){let r=rec(),b=r[0];return `<div class="g"><section><div class="card hero"><div class="m">CURRENT PICK ${s.pick} / 60 • ${esc(team(s.pick))}</div><h2>${b?esc(b.p[0]):'No players available'}</h2><span class="pill">${b?.p[1]||''}</span><div class="score">${b?b.score.toFixed(0):'—'}</div><div class="m">DRAFT SCORE</div><p>${b?reason(b):''}</p><div class="actions">${b?`<button class="go" onclick="draft('${esc(b.p[0])}')">DRAFT PLAYER</button>`:''}<button onclick="next()">Advance Pick</button></div></div><div class="g3"><div class="stat">Available<b>${avail().length}</b></div><div class="stat">Next Scott Pick<b>${nextScott()||'—'}</b></div><div class="stat">Picks Away<b>${nextScott()?nextScott()-s.pick:'—'}</b></div></div><div class="card"><h3>🔥 Suggested Players</h3>${r.slice(0,8).map(row).join('')}</div></section><aside><div class="card"><h3>🔮 Likely Around Next Pick</h3><div class="notice">Estimate updates as picks are recorded.</div>${r.slice(0,8).sort((a,b)=>b.surv-a.surv).slice(0,5).map(x=>`<div class="row"><span><b>${esc(x.p[0])}</b><br><small class="m">${x.p[1]} • Rank ${x.p[2]}</small></span><b class="${x.surv<35?'bad':x.surv<65?'warn':'good'}">${x.surv}%</b></div>`).join('')}</div><div class="card"><h3>🎯 Targets</h3>${s.targets.length?s.targets.map(t=>`<div class="row"><span>${esc(t.name)}<br><small>${['','Watch','Target','Must Have'][t.level]}</small></span><button class="red" onclick="delTarget('${esc(t.name)}')">×</button></div>`).join(''):'<span class="m">None yet.</span>'}</div></aside></div>`}function reason(x){let p=x.p;return (s.targets.find(t=>t.name===p[0])||{}).level>=3?`🔥 Must Have target. Strong target bonus.`:x.surv<35?`⚠️ Only ${x.surv}% estimated to survive your next pick.`:need(p[1])>70?`High ${p[1]} need plus strong player value.`:`Best blend of player rank, roster fit and pick urgency.`}function row(x){return `<div class="row"><span><b>${esc(x.p[0])}</b><br><small class="m">${x.p[1]} • Rank ${x.p[2]}</small></span><span><b>${x.score.toFixed(0)}</b><br><small class="m">${x.surv}% next</small></span></div>`}function nextScott(){for(let i=s.pick;i<=60;i++)if(team(i)==='Scott')return i;return null}function draft(name){let p=s.players.find(x=>x[0]===name);if(!p)return;s.draft.push({pick:s.pick,team:team(s.pick),name:p[0],pos:p[1]});s.pick=Math.min(61,s.pick+1);save();view('draft')}function next(){s.pick=Math.min(61,s.pick+1);save();view('draft')}function board(){return `<div class="card"><h2>📋 Draft Board</h2><div class="notice">Non-snake • 10 teams • 6 rounds. Your picks are highlighted.</div><table><thead><tr><th>Pick</th><th>Team</th><th>Player</th><th>Pos</th><th></th></tr></thead><tbody>${Array.from({length:60},(_,i)=>{let p=i+1,d=s.draft.find(x=>x.pick===p);return `<tr ${team(p)==='Scott'?'style="background:#132b28"':''}><td>${p}</td><td>${esc(team(p))}</td><td>${d?esc(d.name):'<span class="m">—</span>'}</td><td>${d?d.pos:'—'}</td><td>${!d?`<button onclick="jump(${p})">Set</button>`:''}</td></tr>`}).join('')}</tbody></table><div class="actions"><button onclick="undo()">↩ Undo Last Pick</button></div></div>`}function jump(p){s.pick=p;save();view('draft')}function undo(){let d=s.draft.pop();if(d)s.pick=d.pick;save();view('board')}function players(){return `<div class="card"><h2>Available Players</h2><div class="filters"><input id="q" placeholder="Search..." oninput="filter()"><select id="pos" onchange="filter()"><option value="">All</option><option>QB</option><option>RB</option><option>WR</option><option>TE</option></select></div><div id="plist"></div></div>`}function filter(){let q=($('q').value||'').toLowerCase(),p=$('pos').value,a=rec().filter(x=>(!q||x.p[0].toLowerCase().includes(q))&&(!p||x.p[1]===p));$('plist').innerHTML=`<table><tr><th>Player</th><th>Pos</th><th>Rank</th><th>Score</th><th>Next</th></tr>${a.map(x=>`<tr><td>${esc(x.p[0])}</td><td>${x.p[1]}</td><td>${x.p[2]}</td><td>${x.score.toFixed(0)}</td><td>${x.surv}%</td></tr>`).join('')}</table>`}function targets(){return `<div class="g"><div class="card"><h2>🎯 My Targets</h2>${s.targets.length?s.targets.map(t=>`<div class="row"><span><b>${esc(t.name)}</b><br><small>${['','Watch','Target','Must Have'][t.level]}</small></span><button class="red" onclick="delTarget('${esc(t.name)}')">Remove</button></div>`).join(''):'<span class="m">No targets.</span>'}</div><div class="card"><h3>Add Target</h3><select id="tp">${avail().map(p=>`<option>${esc(p[0])}</option>`).join('')}</select><select id="tl" style="margin-top:8px"><option value="1">Watch</option><option value="2">Target</option><option value="3">Must Have</option></select><button class="go" style="margin-top:8px" onclick="addTarget()">Add</button></div></div>`}function addTarget(){let n=$('tp').value,l=+$('tl').value;s.targets=s.targets.filter(t=>t.name!==n);s.targets.push({name:n,level:l});save();view('targets')}function delTarget(n){s.targets=s.targets.filter(t=>t.name!==n);save();view('targets')}function roster(){return `<div class="g"><div class="card"><h2>👤 My Roster</h2>${my().map(x=>`<div class="row"><span><b>${esc(x.name)}</b><br><small class="m">${x.pos||'Keeper'}</small></span>${x.keeper?'<span class="pill">KEEPER</span>':''}</div>`).join('')}</div><div class="card"><h3>Roster Strategy</h3><div class="notice">You already have Josh Allen, Jahmyr Gibbs, Justin Jefferson and Ashton Jeanty. The engine therefore strongly favors filling WR/RB depth and flex value before taking another QB.</div></div></div>`}function teams(){return `<div class="card"><h2>👥 Teams & Keepers</h2><div class="notice">Six teams are still pending. Add them as they submit.</div><table><tr><th>Team</th><th>QB</th><th>RB</th><th>WR</th><th>WRT</th></tr>${s.teams.map((t,i)=>`<tr><td><b>${esc(t[0])}</b></td>${t.slice(1).map((x,j)=>`<td><input value="${esc(x)}" onchange="keeper(${i},${j+1},this.value)"></td>`).join('')}</tr>`).join('')}</table></div>`}function keeper(i,j,v){s.teams[i][j]=v.trim();save();view('teams')}view('draft');</script></body></html>
