<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DraftIQ</title><style>:root{--bg:#08111f;--c:#111d30;--c2:#17263d;--l:#2a3b58;--t:#f4f7fb;--m:#9fb0c7;--g:#42d392;--y:#ffd166;--r:#ff6b6b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px system-ui,-apple-system,Segoe UI,sans-serif}header{position:sticky;top:0;z-index:5;background:#091322ee;border-bottom:1px solid var(--l);padding:13px}h1{margin:0;font-size:22px}.m{color:var(--m)}nav{display:flex;gap:7px;overflow:auto;margin-top:10px}button{background:var(--c2);color:var(--t);border:1px solid var(--l);border-radius:9px;padding:9px 12px;font-weight:700;cursor:pointer}button.on,button.go{background:var(--g);color:#06120d;border-color:var(--g)}button.red{background:#3a2026;color:#ffdfe2}main{max-width:1280px;margin:auto;padding:15px}.grid{display:grid;grid-template-columns:1.25fr .75fr;gap:14px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{background:var(--c);border:1px solid var(--l);border-radius:15px;padding:15px;margin-bottom:12px}.hero{background:linear-gradient(135deg,#123029,#122139)}.hero h2{font-size:29px;margin:8px 0}.big{font-size:42px;color:var(--g);font-weight:900}.stat,.row{background:#0c1626;border:1px solid var(--l);border-radius:10px;padding:10px}.stat b{display:block;font-size:20px;margin-top:2px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:7px}.pill{display:inline-block;background:#263753;border-radius:99px;padding:3px 8px;font-size:12px}.good{color:var(--g)}.warn{color:var(--y)}.bad{color:var(--r)}.notice{background:#17263b;border:1px solid var(--l);border-radius:9px;padding:10px;margin-bottom:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid var(--l);text-align:left;font-size:13px}th{color:var(--m)}input,select{width:100%;background:#0c1626;color:var(--t);border:1px solid var(--l);border-radius:8px;padding:8px}.filters{display:flex;gap:8px;margin-bottom:10px}.filters>*{flex:1}.mini{font-size:12px}@media(max-width:800px){.grid,.three{grid-template-columns:1fr}main{padding:10px}.hero h2{font-size:24px}.filters{flex-wrap:wrap}.filters>*{min-width:45%}th,td{padding:6px;font-size:12px}}</style></head><body><header><h1>🏈 DraftIQ <span class="m" id="status">Pre-Draft</span></h1><nav id="nav"></nav></header><main id="app"></main><script>
const KEY='draftiq_v4';
const TEAMS=['Scott','Brandon','Phillip','Andy','Hunter','Dave','Cody','Chris','Brian','Sean'];

const proj=[

['Jahmyr Gibbs','RB',1,0,0,0,1381.2,13.8,71.3,580.6,4.1,1.1],['Bijan Robinson','RB',2,0,0,0,1426.1,9.5,79.3,735.9,3.5,1.8],['Christian McCaffrey','RB',3,0,0,0,1093.6,8.7,78.4,694,4.6,1.1],['Jonathan Taylor','RB',4,0,0,0,1504.6,12.9,42.9,341.5,1.5,1.7],['De\'Von Achane','RB',5,0,0,0,1199.8,6,65.3,490.7,4,1],['Chase Brown','RB',6,0,0,0,1036.8,7.8,63.8,427.6,4,1.1],['Ashton Jeanty','RB',7,0,0,0,1105.2,8,58.7,414.6,3.3,1.1],['Derrick Henry','RB',8,0,0,0,1568.5,13.4,18.1,175.1,.7,1.7],['James Cook','RB',9,0,0,0,1404.7,10.3,33.3,283.7,1.9,2.4],['Saquon Barkley','RB',10,0,0,0,1299.1,8.2,41.7,330.4,2.1,1],
['Puka Nacua','WR',1,0,0,0,85,1.4,117,1539,9,1],['Ja\'Marr Chase','WR',2,0,0,0,17,0,121.1,1509.4,10.6,1],['Jaxon Smith-Njigba','WR',3,0,0,0,30.4,.1,110.9,1569.7,9.2,1.1],['Amon-Ra St. Brown','WR',4,0,0,0,11.8,0,117.4,1390.4,10.5,.4],['Drake London','WR',5,0,0,0,0,0,101.7,1328.2,9.4,1],['CeeDee Lamb','WR',6,0,0,0,12.5,0,97.6,1296.6,7.5,.3],['Rashee Rice','WR',7,0,0,0,25.5,.9,99.1,1099.7,9.7,.6],['Justin Jefferson','WR',8,0,0,0,5.5,0,98.6,1310.9,7.1,.3],['George Pickens','WR',9,0,0,0,-.3,0,82.6,1201.4,8.4,.5],['A.J. Brown','WR',10,0,0,0,0,0,87.7,1222,7.6,.3],
['Trey McBride','TE',1,0,0,0,0,0,108.9,1050.8,6.8,.2],['Brock Bowers','TE',2,0,0,0,0,0,97,1022.9,7.5,.2],['Colston Loveland','TE',3,0,0,0,0,0,79.1,927.5,6.7,.2],['Tyler Warren','TE',4,0,0,0,0,0,79,878.1,5.5,.3],['Tucker Kraft','TE',5,0,0,0,0,0,61.5,785.8,6.5,.2],['Kyle Pitts','TE',6,0,0,0,0,0,79.5,880.9,4.7,.1],['Dallas Goedert','TE',7,0,0,0,0,0,65.5,688.9,7.6,.2],['George Kittle','TE',8,0,0,0,0,0,67.9,771.4,6.1,.2],['Harold Fannin Jr.','TE',9,0,0,0,0,0,79.7,816.7,5.4,.8],['Sam LaPorta','TE',10,0,0,0,0,0,68.4,787.5,5.5,.2]
];
const baseTeams=[['Scott','Josh Allen','Jahmyr Gibbs','Justin Jefferson','Ashton Jeanty'],['Brandon','Jaxson Dart','Bijan Robinson','Amon-Ra St. Brown','Jaxon Smith-Njigba'],['Phillip','Joe Burrow',"De'Von Achane",'Ja\'Marr Chase','Puka Nacua'],['Andy','Jalen Hurts','Saquon Barkley','Jonathan Taylor','Nico Collins'],['Hunter','','','',''],['Dave','','','',''],['Cody','','','',''],['Chris','','','',''],['Brian','','','',''],['Sean','','','','']];
const base={teams:baseTeams,players:proj.map(x=>x[0]),draft:[],targets:[],pick:1,pickOwners:{1:'Scott',9:'Scott',19:'Scott',39:'Scott',49:'Scott',59:'Scott'},trades:[]};
let s=JSON.parse(localStorage.getItem(KEY)||'null')||base;s.pickOwners=s.pickOwners||base.pickOwners;s.trades=s.trades||[];save();
const pages=[['draft','Draft'],['board','Board'],['players','Available'],['targets','Targets'],['roster','My Roster'],['league','League']];
const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem(KEY,JSON.stringify(s))}function owner(p){return s.pickOwners[p]||TEAMS[(p-1)%10]}function current(){return owner(s.pick)}function pdata(n){return proj.find(x=>x[0]===n)||null}function taken(){return new Set([...s.teams.flatMap(t=>t.slice(1).filter(Boolean)),...s.draft.map(x=>x.name)])}function avail(){let t=taken();return s.players.map(n=>pdata(n)).filter(Boolean).filter(x=>!t.has(x[0]))}function my(){let a=s.teams[0].slice(1).filter(Boolean).map(n=>({name:n,pos:(pdata(n)||[])[1],keeper:true}));s.draft.filter(x=>x.team==='Scott').forEach(x=>a.push({name:x.name,pos:x.pos}));return a}
function pts(x){if(!x)return null;let py=x[3],pt=x[4],ii=x[5],ry=x[6],rt=x[7],rec=x[8],cy=x[9],ct=x[10],fl=x[11];return py/25+pt*6-ii+ry/10+rt*6+rec+cy/10+ct*6-fl*2}
function need(po){let r=my(),n=r.filter(x=>x.pos===po).length;if(po==='QB')return n?10:75;if(po==='RB')return Math.max(15,90-n*25);if(po==='WR')return Math.max(15,92-n*22);if(po==='TE')return n?25:60;return 30}function nextMine(){for(let i=s.pick+1;i<=60;i++)if(owner(i)==='Scott')return i;return null}function gap(){let n=nextMine();return n?Math.max(0,n-s.pick):99}function survival(x){let v=pts(x);let stronger=avail().filter(y=>pts(y)>v).length;return Math.max(5,Math.min(97,100-stronger*6-gap()*2))}function level(n){return(s.targets.find(t=>t.name===n)||{}).level||0}function score(x){let v=pts(x),mx=Math.max(...avail().map(y=>pts(y)),1);return Math.min(100,v/mx*65+need(x[1])*.25+(100-survival(x))*.1+level(x[0])*7)}function rec(){return avail().map(x=>({p:x,pts:pts(x),surv:survival(x),score:score(x)})).sort((a,b)=>b.score-a.score)}
function nav(v){$('nav').innerHTML=pages.map(x=>`<button class="${v===x[0]?'on':''}" onclick="view('${x[0]}')">${x[1]}</button>`).join('')}function view(v){nav(v);$('status').textContent=`• Pick ${s.pick} • ${current()}`;$('app').innerHTML=v==='draft'?draft():v==='board'?board():v==='players'?players():v==='targets'?targets():v==='roster'?roster():league();if(v==='players')filterPlayers()}
function suggestion(x){return `<div class="row"><span><b>${esc(x.p[0])}</b><br><span class="m mini">${x.p[1]} • ${x.pts.toFixed(1)} pts • ${x.surv}% next</span></span><b>${x.score.toFixed(0)}</b></div>`}
function draft(){let r=rec(),b=r[0];return `<div class="grid"><section><div class="card hero"><div class="m">CURRENT PICK ${s.pick} / 60 • ${esc(current())}</div>${b?`<h2>${esc(b.p[0])}</h2><span class="pill">${b.p[1]} • 2026 projected ${b.pts.toFixed(1)} pts</span><div class="big">${b.score.toFixed(0)}</div><div class="m">DRAFTIQ SCORE</div><p>${b.surv<35?'⚠️ Only '+b.surv+'% estimated to survive your next pick.':need(b.p[1])>70?'High roster need plus strong projected value.':'Best current blend of projected value, roster need and pick urgency.'}</p><div class="actions"><button class="go" onclick="draftPlayer('${esc(b.p[0])}')">DRAFT PLAYER</button><button onclick="advance()">Advance Pick</button></div>`:`<div class="notice">No verified 2026 projection is currently loaded for the remaining player pool.</div>`}</div><div class="three"><div class="stat">Available<b>${avail().length}</b></div><div class="stat">Next Scott Pick<b>${nextMine()||'—'}</b></div><div class="stat">Picks Away<b>${nextMine()?nextMine()-s.pick:'—'}</b></div></div><div class="card"><h3>🔥 Suggested Players</h3>${r.slice(0,8).map(suggestion).join('')}</div></section><aside><div class="card"><h3>🔮 Around Your Next Pick</h3><div class="notice">Survival estimates use the actual pick owners and current verified projections.</div>${r.slice(0,8).sort((a,b)=>b.surv-a.surv).slice(0,5).map(x=>`<div class="row"><span><b>${esc(x.p[0])}</b><br><small class="m">${x.p[1]} • ${x.pts.toFixed(1)} pts</small></span><b class="${x.surv<35?'bad':x.surv<65?'warn':'good'}">${x.surv}%</b></div>`).join('')}</div><div class="card"><h3>🎯 Targets</h3>${s.targets.length?s.targets.map(t=>`<div class="row"><span>${esc(t.name)}<br><small>${['','Watch','Target','Must Have'][t.level]}</small></span><button class="red" onclick="delTarget('${esc(t.name)}')">×</button></div>`).join(''):'<span class="m">None yet.</span>'}</div></aside></div>`}
function draftPlayer(n){let p=pdata(n);if(!p)return;s.draft.push({pick:s.pick,team:current(),name:p[0],pos:p[1],pts:pts(p)});s.pick=Math.min(61,s.pick+1);save();view('draft')}function advance(){s.pick=Math.min(61,s.pick+1);save();view('draft')}
function board(){return `<div class="card"><h2>📋 Draft Board</h2><div class="notice">Scott owns 1.01, 1.09, 2.09, 4.09, 5.09 and 6.09. Round 3 pick 3.09 is traded away. Swap any two pick owners below.</div><table><tr><th>Pick</th><th>Owner</th><th>Player</th><th>Pos</th></tr>${Array.from({length:60},(_,i)=>{let p=i+1,d=s.draft.find(x=>x.pick===p);return `<tr ${owner(p)==='Scott'?'style="background:#132b28"':''}><td>${p}</td><td>${esc(owner(p))}</td><td>${d?esc(d.name):'<span class="m">—</span>'}</td><td>${d?d.pos:'—'}</td></tr>`}).join('')}</table><div class="card"><h3>🔄 Swap Picks</h3><div class="three"><label>Pick A<select id="a">${Array.from({length:60},(_,i)=>`<option value="${i+1}">${i+1} — ${esc(owner(i+1))}</option>`).join('')}</select></label><label>Pick B<select id="b">${Array.from({length:60},(_,i)=>`<option value="${i+1}">${i+1} — ${esc(owner(i+1))}</option>`).join('')}</select></label><div><button class="go" style="margin-top:24px" onclick="swap()">SWAP OWNERS</button></div></div></div><div class="actions"><button onclick="undo()">↩ Undo Last Pick</button></div></div>`}function swap(){let a=+$('a').value,b=+$('b').value;if(a===b)return;let oa=owner(a),ob=owner(b);s.pickOwners[a]=ob;s.pickOwners[b]=oa;s.trades.push({a,b,oa,ob,when:new Date().toISOString()});save();view('board')}function undo(){let d=s.draft.pop();if(d)s.pick=d.pick;save();view('board')}
function players(){return `<div class="card"><h2>Available Players</h2><div class="filters"><input id="q" placeholder="Search..." oninput="filterPlayers()"><select id="pos" onchange="filterPlayers()"><option value="">All</option><option>QB</option><option>RB</option><option>WR</option><option>TE</option></select></div><div class="notice">The current player pool contains verified 2026 projection inputs. DraftIQ recalculates those projections using your exact scoring.</div><div id="plist"></div></div>`}function filterPlayers(){let q=($('q')?.value||'').toLowerCase(),po=$('pos')?.value||'',a=rec().filter(x=>(!q||x.p[0].toLowerCase().includes(q))&&(!po||x.p[1]===po));if($('plist'))$('plist').innerHTML=`<table><tr><th>Player</th><th>Pos</th><th>2026 Proj</th><th>DraftIQ</th><th>Next</th></tr>${a.map(x=>`<tr><td><b>${esc(x.p[0])}</b></td><td>${x.p[1]}</td><td>${x.pts.toFixed(1)}</td><td>${x.score.toFixed(0)}</td><td>${x.surv}%</td></tr>`).join('')}</table>`}
function targets(){return `<div class="grid"><div class="card"><h2>🎯 My Targets</h2>${s.targets.length?s.targets.map(t=>`<div class="row"><span><b>${esc(t.name)}</b><br><small>${['','Watch','Target','Must Have'][t.level]}</small></span><button class="red" onclick="delTarget('${esc(t.name)}')">Remove</button></div>`).join(''):'<span class="m">No targets.</span>'}</div><div class="card"><h3>Add Target</h3><select id="tp">${avail().map(p=>`<option>${esc(p[0])}</option>`).join('')}</select><select id="tl" style="margin-top:8px"><option value="1">Watch</option><option value="2">Target</option><option value="3">Must Have</option></select><button class="go" style="margin-top:8px" onclick="addTarget()">Add</button></div></div>`}function addTarget(){let n=$('tp').value,l=+$('tl').value;s.targets=s.targets.filter(t=>t.name!==n);s.targets.push({name:n,level:l});save();view('targets')}function delTarget(n){s.targets=s.targets.filter(t=>t.name!==n);save();view('targets')}
function roster(){return `<div class="grid"><div class="card"><h2>👤 My Roster</h2>${my().map(x=>`<div class="row"><span><b>${esc(x.name)}</b><br><small class="m">${x.pos||''}</small></span>${x.keeper?'<span class="pill">KEEPER</span>':''}</div>`).join('')}</div><div class="card"><h3>Roster Strategy</h3><div class="notice">Scott starts with Josh Allen, Jahmyr Gibbs, Justin Jefferson and Ashton Jeanty. QB is therefore a low priority unless value becomes extreme. WR/RB depth and flex value are more important.</div></div></div>`}
function league(){return `<div class="card"><h2>👥 Teams & Keepers</h2><div class="notice">Known keepers are loaded. Six teams are still pending. Edit keeper cells as teammates submit.</div><table><tr><th>Team</th><th>Keeper 1</th><th>Keeper 2</th><th>Keeper 3</th><th>Keeper 4</th></tr>${s.teams.map((t,i)=>`<tr><td><b>${esc(t[0])}</b></td>${t.slice(1).map((x,j)=>`<td><input value="${esc(x)}" onchange="keeper(${i},${j+1},this.value)"></td>`).join('')}</tr>`).join('')}</table></div>`}function keeper(i,j,v){s.teams[i][j]=v.trim();save();view('league')}
view('draft');
</script></body></html>
