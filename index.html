<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080808">
<title>Red Zone DraftIQ</title>
<style>
:root{--bg:#080808;--panel:#111214;--panel2:#17181b;--line:#2b2d31;--text:#f5f5f5;--muted:#92959c;--red:#e21b23;--green:#39d353}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#080808;color:var(--text);font:13px Inter,system-ui,-apple-system,Segoe UI,sans-serif}body{background:radial-gradient(circle at 65% -10%,#1b0b0d 0,#080808 34%)}
header{position:fixed;inset:0 auto 0 0;width:210px;background:linear-gradient(180deg,#101011,#09090a);border-right:1px solid #25262a;padding:15px 13px;z-index:10;display:flex;flex-direction:column;overflow:auto}.brand{text-align:center;padding-bottom:12px;border-bottom:1px solid #25262a;margin-bottom:10px}.brand-logo{width:105px;height:105px}.brand-title{font-size:23px;font-weight:950;color:var(--red);letter-spacing:1.3px}.brand-sub{font-size:9px;letter-spacing:2px;font-weight:800}.m{color:var(--muted)}#status{display:block;margin:8px 0 10px;padding:9px;background:#120d0e;border:1px solid #342025;border-radius:8px;font-size:11px;line-height:1.45}nav{display:flex;flex-direction:column;gap:3px}nav button{background:transparent;border:0;border-left:3px solid transparent;color:#babcc1;text-align:left;padding:9px 10px;border-radius:4px;font-size:12px}nav button.on{background:#211012;border-left-color:var(--red);color:#fff}
button,select,input{font:inherit;background:#141518;color:#eee;border:1px solid #34363b;border-radius:6px;padding:7px 9px}button{cursor:pointer;font-weight:750}button.go{background:linear-gradient(180deg,#ef252d,#bd1219);border-color:#ef252d;color:#fff}button.red{background:#331316;color:#ffb1b5;border-color:#632128}button:disabled{opacity:.45}.pill{display:inline-block;border:1px solid #3b3c41;background:#18191c;border-radius:20px;padding:3px 7px;font-size:10px}.notice{background:#100d0e;border:1px solid #392024;border-left:3px solid var(--red);border-radius:6px;padding:8px 10px;margin-bottom:9px;color:#c7c7ca;font-size:11px}.targeted{border-color:#17692b!important;box-shadow:inset 3px 0 0 #27c447;background:#101712!important}.clock{color:#ff6167;font-weight:900;font-size:9px;letter-spacing:.5px}
main{margin-left:210px;padding:16px 18px 28px;min-height:100vh}main:before{content:'RED ZONE COMMAND CENTER';display:block;font-size:22px;font-weight:950;letter-spacing:.8px;margin-bottom:3px}main:after{content:'LIVE FANTASY DRAFT OPERATIONS';display:block;color:var(--red);letter-spacing:2px;font-size:8px;font-weight:850;margin-bottom:10px}.card{background:linear-gradient(180deg,#121315,#0f1012);border:1px solid #303238;border-radius:8px;padding:12px;margin-bottom:10px;box-shadow:0 8px 24px rgba(0,0,0,.18)}.card h2,.card h3{margin:0 0 8px}.hero{background:linear-gradient(135deg,#1a1113,#101112);border-left:3px solid var(--red)}.big{font-size:36px;color:var(--red);font-weight:950}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 9px;margin-top:5px;background:#101113;border:1px solid #25272b;border-radius:6px}.mini{font-size:11px}.filters,.trade{display:grid;grid-template-columns:1.35fr .8fr .9fr;gap:7px;margin-bottom:9px}.grid{display:grid;grid-template-columns:1.6fr .8fr;gap:10px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px}.section-head h3{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.4px}.section-head button{font-size:10px;padding:5px 7px}
table{width:100%;border-collapse:collapse;background:#0f1012;border:1px solid #292b30}th{background:#141518;color:#a7a9ae;text-transform:uppercase;font-size:9px;letter-spacing:.4px}th,td{padding:6px 7px;border-bottom:1px solid #292b30;text-align:left;font-size:10px}.roundhead td{background:#1a1012;color:#fff;font-weight:900}.keeper{background:#151119}.mine{background:linear-gradient(90deg,#4b1216,#251013)!important}.active-pick{outline:1px solid var(--red);outline-offset:-1px}
/* single-screen cockpit */
.cockpit{height:calc(100vh - 75px);min-height:620px;display:grid;grid-template-rows:64px minmax(0,1fr);gap:9px;overflow:hidden}.cockpit-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.cockpit-stat{background:linear-gradient(180deg,#151619,#101113);border:1px solid #303238;border-radius:8px;padding:8px 11px;overflow:hidden}.cockpit-stat span{display:block;color:#8f9298;text-transform:uppercase;font-size:8px;font-weight:850;letter-spacing:.7px}.cockpit-stat strong{display:block;font-size:22px;line-height:1.05;margin:4px 0 2px}.cockpit-stat small{color:#b6b8bd;font-size:9px}.cockpit-stat.accent{border-top:2px solid var(--red)}.cockpit-stat.accent strong{color:#ff4249}.cockpit-grid{display:grid;grid-template-columns:1.25fr .95fr .9fr;grid-template-rows:1fr 1fr;gap:9px;min-height:0}.cockpit-panel{background:linear-gradient(180deg,#121315,#0f1012);border:1px solid #303238;border-radius:8px;padding:10px;min-height:0;overflow:hidden}.cockpit-panel h3{font-size:11px;margin:0;text-transform:uppercase}.recommend{grid-column:1;grid-row:1;display:flex;flex-direction:column}.recommend-name{font-size:26px;font-weight:950;margin:6px 0 5px}.recommend-score{display:flex;align-items:flex-end;gap:8px;margin-top:6px}.recommend-score strong{font-size:38px;color:var(--red);line-height:1}.recommend-score span{color:var(--muted);font-size:9px;text-transform:uppercase;margin-bottom:4px}.recommend-meta{font-size:11px;color:#b8bac0;line-height:1.5}.recommend .go{margin-top:auto;width:100%}.best{grid-column:2;grid-row:1}.likely{grid-column:3;grid-row:1}.team{grid-column:1;grid-row:2}.targets{grid-column:2;grid-row:2}.roundboard{grid-column:3;grid-row:2}.live-list{display:grid;gap:4px}.live-player{display:grid;grid-template-columns:28px minmax(0,1fr) 42px 42px;gap:6px;align-items:center;padding:5px 6px;border:1px solid #27292e;border-radius:5px;background:#0e0f11}.live-player .rk{display:grid;place-items:center;height:26px;border-radius:5px;background:#17181b;color:#aaa;font-weight:900;font-size:10px}.live-player b,.live-player small{display:block}.live-player small{color:#82858b;font-size:9px}.live-player .metric{text-align:right}.live-player .metric b{font-size:11px}.compact-list{display:grid}.compact-item{display:flex;justify-content:space-between;align-items:center;gap:7px;padding:5px 1px;border-bottom:1px solid #24262a}.compact-item:last-child{border-bottom:0}.compact-item b,.compact-item small{display:block}.compact-item small{color:#85888e;font-size:9px;margin-top:1px}.prob{color:#63d979;font-weight:900}.mini-board th,.mini-board td{padding:4px 5px;font-size:9px}.team-roster-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}.team-roster-grid .compact-item{border:1px solid #24262a;border-radius:5px;padding:5px 6px}.panel-link{font-size:9px;padding:4px 6px}
.team-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.team-card{background:#0f1012;border:1px solid #2c2e33;border-radius:8px;overflow:hidden}.team-card-head{padding:10px;background:#141518}.team-roster-list{padding:5px 10px 9px}.position-counts{display:flex;gap:4px;flex-wrap:wrap}.position-counts span{font-size:9px;background:#1b1c1f;border-radius:20px;padding:2px 5px}
@media(max-width:1150px){header{width:185px}.brand-logo{width:82px;height:82px}.brand-title{font-size:19px}main{margin-left:185px;padding:12px}.cockpit-grid{grid-template-columns:1.15fr .9fr .85fr}.recommend-name{font-size:22px}.cockpit{min-height:580px}}
@media(max-width:900px){header{position:sticky;top:0;width:100%;height:auto;padding:8px 10px;display:block}.brand{display:flex;align-items:center;text-align:left;gap:8px;padding:0 0 6px;margin-bottom:6px}.brand-logo{width:48px;height:48px}.brand-title{font-size:19px}.brand-sub{font-size:8px}#status{position:absolute;right:8px;top:6px;max-width:145px;margin:0;padding:6px;font-size:9px}nav{flex-direction:row;overflow-x:auto}nav button{white-space:nowrap;width:auto;border-left:0;border-bottom:2px solid transparent;padding:7px 8px}nav button.on{border-left:0;border-bottom-color:var(--red)}main{margin-left:0;padding:10px}main:before{font-size:18px}.cockpit{height:auto;overflow:visible}.cockpit-stats{grid-template-columns:repeat(2,1fr)}.cockpit-grid{grid-template-columns:1fr;grid-template-rows:auto}.recommend,.best,.likely,.team,.targets,.roundboard{grid-column:1;grid-row:auto}.grid,.filters,.trade,.team-grid{grid-template-columns:1fr}table{display:block;overflow-x:auto}}
</style>
</head>
<body>
<header>
<div class="brand"><svg class="brand-logo" viewBox="0 0 180 180" role="img" aria-label="Red Zone logo"><path d="M90 8 159 40v76l-69 56-69-56V40Z" fill="#0c0c0d" stroke="#e8dfbf" stroke-width="7"/><path d="M90 20 147 47v61l-57 47-57-47V47Z" fill="none" stroke="#d71920" stroke-width="7"/><g transform="rotate(-22 90 58)"><ellipse cx="90" cy="58" rx="45" ry="25" fill="#9a421d" stroke="#111" stroke-width="5"/><path d="M65 58h50M76 48v20M86 45v26M96 45v26M106 48v20" stroke="#eee3bd" stroke-width="4" stroke-linecap="round"/></g><rect x="16" y="92" width="148" height="43" rx="4" fill="#0b0b0c"/><text x="90" y="124" text-anchor="middle" fill="#e31b23" font-family="Impact,Arial Black,sans-serif" font-size="37" font-weight="900">RED ZONE</text></svg><div><div class="brand-title">RED ZONE</div><div class="brand-sub">FANTASY DRAFT</div></div></div>
<h1><span class="m" id="status">Loading…</span></h1><nav id="nav"></nav>
</header>
<main id="app"><div class="card">Loading Red Zone DraftIQ…</div></main>
<script src="players.js?v=4"></script>
<script src="app.js?v=8"></script>
<script>
(function(){
  const originalCommandView=commandView;
  commandView=function(){
    const r=rec(),best=r[0],nx=nextMineIncludingCurrent(),future=nextMine(),between=future?Math.max(0,future-s.pick-1):0;
    const likely=r.slice().sort((a,b)=>b.surv-a.surv||b.score-a.score).slice(0,5);
    const currentRound=round(s.pick),start=(currentRound-1)*10+1;
    const currentRows=Array.from({length:10},(_,i)=>{const p=start+i,d=s.draft.find(x=>x.pick===p),o=owner(p);return `<tr class="${p===s.pick?'active-pick ':''}${o==='Scott'?'mine':''}"><td>${fmtPick(p)}</td><td>${E(o)}</td><td>${d?E(d.name):p===s.pick?'<span class="clock">ON CLOCK</span>':'—'}</td></tr>`}).join('');
    const targets=s.targets.filter(t=>{const p=player(t.name);return p&&!taken().has(keyName(t.name))}).slice(0,5);
    const roster=myRoster().slice(0,8);
    return `<div class="cockpit"><div class="cockpit-stats"><div class="cockpit-stat"><span>Current Pick</span><strong>${fmtPick(s.pick)}</strong><small>${E(owner(s.pick))}</small></div><div class="cockpit-stat accent"><span>Your Next Pick</span><strong>${nx?fmtPick(nx):'—'}</strong><small>${nx===s.pick?'You are on the clock':future?`${between} picks away`:'No picks remaining'}</small></div><div class="cockpit-stat"><span>Picks Until Next</span><strong>${nx===s.pick?0:between}</strong><small>${future?`Next: ${fmtPick(future)}`:'—'}</small></div><div class="cockpit-stat"><span>Roster</span><strong>${myRoster().length}</strong><small>${keeperList('Scott').length} keepers • ${s.draft.filter(d=>d.team==='Scott').length} drafted</small></div></div><div class="cockpit-grid"><section class="cockpit-panel recommend"><div class="section-head"><h3>DraftIQ Recommendation</h3><button class="panel-link" onclick="view('draft')">Assistant</button></div>${best?`<div class="recommend-name">${E(best.p[0])}</div><div><span class="pill">${best.p[1]}</span> <span class="m">Rank ${best.p[2]} • ${best.p[3].toFixed(1)} pts</span></div><div class="recommend-score"><strong>${best.score.toFixed(0)}</strong><span>DraftIQ score</span></div><div class="recommend-meta"><b>${best.surv}%</b> chance to reach your next pick<br>${targetLevel(best.p[0])?'🎯 On your target list':'Best blend of value, roster need and urgency'}</div><button class="go" onclick="draftPlayer(decodeURIComponent('${U(best.p[0])}'))">Draft ${E(best.p[0])}</button>`:'No players remain.'}</section><section class="cockpit-panel best"><div class="section-head"><h3>Best Available</h3><button class="panel-link" onclick="view('players')">All</button></div><div class="live-list">${r.slice(0,5).map(x=>`<div class="live-player ${targetLevel(x.p[0])?'targeted':''}"><div class="rk">${x.p[2]}</div><div><b>${E(x.p[0])}</b><small>${x.p[1]} • ${x.p[3].toFixed(1)} pts</small></div><div class="metric"><b>${x.score.toFixed(0)}</b><small>Score</small></div><div class="metric"><b>${x.surv}%</b><small>Next</small></div></div>`).join('')}</div></section><section class="cockpit-panel likely"><div class="section-head"><h3>Likely At Next Pick</h3><span class="m">${future?fmtPick(future):'—'}</span></div><div class="compact-list">${likely.map(x=>`<div class="compact-item"><span><b>${E(x.p[0])}</b><small>${x.p[1]} • Rank ${x.p[2]}</small></span><span class="prob">${x.surv}%</span></div>`).join('')}</div></section><section class="cockpit-panel team"><div class="section-head"><h3>My Team</h3><button class="panel-link" onclick="view('roster')">Full Team</button></div><div class="team-roster-grid">${roster.map(x=>`<div class="compact-item"><span><b>${E(x.name)}</b><small>${x.pos||'—'}</small></span>${x.keeper?'<span class="pill">K</span>':x.pick?`<span class="m">${fmtPick(x.pick)}</span>`:''}</div>`).join('')}</div></section><section class="cockpit-panel targets"><div class="section-head"><h3>My Targets</h3><button class="panel-link" onclick="view('targets')">All</button></div><div class="compact-list">${targets.length?targets.map(t=>{const p=player(t.name);return `<div class="compact-item"><span><b>${E(t.name)}</b><small>${p?.[1]||''} • ${['','Watch','Target','Must Have'][t.level]}</small></span><span class="prob">${p?survival(p):'—'}%</span></div>`}).join(''):'<span class="m">No available targets.</span>'}</div></section><section class="cockpit-panel roundboard"><div class="section-head"><h3>Round ${currentRound}</h3><button class="panel-link" onclick="view('board')">Full Board</button></div><table class="mini-board"><tr><th>Pick</th><th>Owner</th><th>Player</th></tr>${currentRows}</table></section></div></div>`;
  };
  view('command');
})();
</script>
</body>
</html>
