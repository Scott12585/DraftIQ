<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DraftIQ</title><style>:root{--bg:#08111f;--c:#111d30;--c2:#17263d;--l:#2a3b58;--t:#f4f7fb;--m:#9fb0c7;--g:#42d392;--y:#ffd166;--r:#ff6b6b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px system-ui,-apple-system,Segoe UI,sans-serif}header{position:sticky;top:0;z-index:5;background:#091322ee;border-bottom:1px solid var(--l);padding:13px}h1{margin:0;font-size:22px}.m{color:var(--m)}nav{display:flex;gap:7px;overflow:auto;margin-top:10px}button{background:var(--c2);color:var(--t);border:1px solid var(--l);border-radius:9px;padding:9px 12px;font-weight:700}button.on,button.go{background:var(--g);color:#06120d;border-color:var(--g)}button.red{background:#3a2026;color:#ffdfe2}main{max-width:1280px;margin:auto;padding:15px}.grid{display:grid;grid-template-columns:1.25fr .75fr;gap:14px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{background:var(--c);border:1px solid var(--l);border-radius:15px;padding:15px;margin-bottom:12px}.hero{background:linear-gradient(135deg,#123029,#122139)}.hero h2{font-size:29px;margin:8px 0}.big{font-size:42px;color:var(--g);font-weight:900}.stat,.row{background:#0c1626;border:1px solid var(--l);border-radius:10px;padding:10px}.stat b{display:block;font-size:20px;margin-top:2px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:7px}.pill{display:inline-block;background:#263753;border-radius:99px;padding:3px 8px;font-size:12px}.good{color:var(--g)}.warn{color:var(--y)}.bad{color:var(--r)}.notice{background:#17263b;border:1px solid var(--l);border-radius:9px;padding:10px;margin-bottom:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid var(--l);text-align:left;font-size:13px}th{color:var(--m)}input,select{width:100%;background:#0c1626;color:var(--t);border:1px solid var(--l);border-radius:8px;padding:8px}.filters{display:flex;gap:8px;margin-bottom:10px}.filters>*{flex:1}.alert{border-left:4px solid var(--y);padding:10px;background:#211f18;border-radius:8px;margin-top:8px}.mini{font-size:12px}@media(max-width:800px){.grid,.three{grid-template-columns:1fr}main{padding:10px}.hero h2{font-size:24px}.filters{flex-wrap:wrap}.filters>*{min-width:45%}th,td{padding:6px;font-size:12px}}
</style></head><body><header><h1>🏈 DraftIQ <span class="m" id="status">Pre-Draft</span></h1><nav id="nav"></nav></header><main id="app"></main><script>

['Jahmyr Gibbs','RB',1,0,0,0,1381.2,13.8,71.3,580.6,4.1,1.1],['Bijan Robinson','RB',2,0,0,0,1426.1,9.5,79.3,735.9,3.5,1.8],['Christian McCaffrey','RB',3,0,0,0,1093.6,8.7,78.4,694,4.6,1.1],['Jonathan Taylor','RB',4,0,0,0,1504.6,12.9,42.9,341.5,1.5,1.7],['De\'Von Achane','RB',5,0,0,0,1199.8,6,65.3,491.1,4,1],['Chase Brown','RB',6,0,0,0,1036.8,7.8,63.8,427.6,4,1.1],['Ashton Jeanty','RB',7,0,0,0,1105.2,8,58.7,414.6,3.3,1.1],['Derrick Henry','RB',8,0,0,0,1568.5,13.4,18.1,175.1,.7,1.7],['James Cook','RB',9,0,0,0,1404.7,10.3,33.3,283.7,1.9,2.4],['Saquon Barkley','RB',10,0,0,0,1299.1,8.2,41.7,330.4,2.1,1],

['Trey McBride','TE',1,0,0,0,0,0,108.9,1051.1,6.8,.2],['Brock Bowers','TE',2,0,0,0,0,0,96.6,1026.9,7.5,.2],['Colston Loveland','TE',3,0,0,0,0,0,79.1,927.5,6.7,.2],['Tyler Warren','TE',4,0,0,0,0,0,79,878.1,5.5,.3],['Kyle Pitts','TE',5,0,0,0,0,0,79.5,880.9,4.7,.1],['Harold Fannin Jr.','TE',6,0,0,0,0,0,78.7,816.7,5.4,.8],['Travis Kelce','TE',7,0,0,0,0,0,74.9,785.4,4.8,.3],['Sam LaPorta','TE',8,0,0,0,0,0,68.4,787.5,5.5,.2],['Dallas Goedert','TE',9,0,0,0,0,0,65.5,688.9,7.6,.2],['Tucker Kraft','TE',10,0,0,0,0,0,61.5,785.8,6.5,.2]
];
const names=[...proj.map(x=>x[0]),'Omarion Hampton','Breece Hall','Ladd McConkey','Rashee Rice','Jayden Reed','Chris Olave','Terry McLaurin','George Pickens','DK Metcalf','Kenneth Walker III','James Conner','Bucky Irving','Mark Andrews','George Kittle','Baker Mayfield','Bo Nix','Jared Goff','Justin Fields'];
const pos={"Omarion Hampton":'RB',"Breece Hall":'RB',"Ladd McConkey":'WR',"Rashee Rice":'WR',"Jayden Reed":'WR',"Chris Olave":'WR',"Terry McLaurin":'WR',"George Pickens":'WR',"DK Metcalf":'WR',"Kenneth Walker III":'RB',"James Conner":'RB',"Bucky Irving":'RB',"Mark Andrews":'TE',"George Kittle":'TE',"Baker Mayfield":'QB',"Bo Nix":'QB',"Jared Goff":'QB',"Justin Fields":'QB'};
const rank={};proj.forEach(x=>rank[x[0]]=x[2]);names.forEach((n,i)=>{if(!rank[n])rank[n]=50+i});
const baseTeams=[['Scott','Josh Allen','Jahmyr Gibbs','Justin Jefferson','Ashton Jeanty'],['Brandon','Jaxson Dart','Bijan Robinson','Amon-Ra St. Brown','Jaxon Smith-Njigba'],['Phillip','Joe Burrow',"De'Von Achane",'Ja\'Marr Chase','Puka Nacua'],['Andy','Jalen Hurts','Saquon Barkley','Jonathan Taylor','Nico Collins'],['Hunter','','','',''],['Dave','','','',''],['Cody','','','',''],['Chris','','','',''],['Brian','','','',''],['Sean','','','','']];
const base={teams:baseTeams,players:names,draft:[],targets:[],pick:1,pickOwners:{1:'Scott',9:'Scott',19:'Scott',39:'Scott',49:'Scott',59:'Scott'},trades:[]};
let s=JSON.parse(localStorage.getItem(KEY)||'null')||base;if(!s.pickOwners)s.pickOwners=base.pickOwners;if(!s.trades)s.trades=[];save();
const pages=[['draft','Draft'],['board','Board'],['players','Available'],['targets','Targets'],['roster','My Roster'],['league','League']];
const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem(KEY,JSON.stringify(s))}function owner(p){return s.pickOwners[p]||['Scott','Brandon','Phillip','Andy','Hunter','Dave','Cody','Chris','Brian','Sean'][(p-1)%10]}function current(){return owner(s.pick)}function taken(){return new Set([...s.teams.flatMap(t=>t.slice(1).filter(Boolean)),...s.draft.map(x=>x.name)])}function data(n){let x=proj.find(p=>p[0]===n);if(x)return x;return [n,pos[n]||'WR',rank[n],0,0,0,0,0,0,0,0,0]}function avail(){let t=taken();return names.map(data).filter(x=>!t.has(x[0]))}function my(){let a=s.teams[0].slice(1).filter(Boolean).map(n=>({name:n,pos:data(n)[1],keeper:true}));s.draft.filter(x=>x.team==='Scott').forEach(x=>a.push({name:x.name,pos:x.pos}));return a}
function pts(p){let x=data(p[0]),py=x[3],pt=x[4],ii=x[5],ry=x[6],rt=x[7],rec=x[8],cy=x[9],ct=x[10],fl=x[11];if(!(py||ry||rec||cy))return null;return py/25+pt*6-ii+ry/10+rt*6+rec+cy/10+ct*6-fl*2}
function need(po){let r=my(),n=r.filter(x=>x.pos===po).length;if(po==='QB')return n?10:75;if(po==='RB')return Math.max(15,90-n*25);if(po==='WR')return Math.max(15,92-n*22);if(po==='TE')return n?25:60;return 30}
function nextMine(){for(let i=s.pick+1;i<=60;i++)if(owner(i)==='Scott')return i;return null}function gap(){let n=nextMine();return n?Math.max(0,n-s.pick):99}
function survival(p){let v=pts(p[0]);if(v==null)return 0;let stronger=avail().filter(x=>(pts(x[0])??-1)>v).length;return Math.max(5,Math.min(97,100-stronger*6-gap()*2))}
function level(n){return(s.targets.find(t=>t.name===n)||{}).level||0}function score(p){let v=pts(p[0]);if(v==null)return -1;let mx=Math.max(...avail().map(x=>pts(x[0])||0),1);return Math.min(100,v/mx*65+need(p[1])*.25+(100-survival(p))*.1+level(p[0])*7)}function rec(){return avail().map(p=>({p,pts:pts(p[0]),surv:survival(p),score:score(p)})).filter(x=>x.score>=0).sort((a,b)=>b.score-a.score)}
function nav(v){$('nav').innerHTML=pages.map(x=>`<button class="${v===x[0]?'on':''}" onclick="view('${x[0]}')">${x[1]}</button>`).join('')}function view(v){nav(v);$('status').textContent=`• Pick ${s.pick} • ${current()}`;$('app').innerHTML=v==='draft'?draft():v==='board'?board():v==='players'?players():v==='targets'?targets():v==='roster'?roster():league();if(v==='players')filterPlayers()}
function suggestion(x){return `<div class="row"><span><b>${esc(x.p[0])}</b><br><span class="m mini">${x.p[1]} • ${x.pts.toFixed(1)} pts • ${x.surv}% next</span></span><b>${x.score.toFixed(0)}</b></div>`}
function draft(){let r=rec(),b=r[0];return `<div class="grid"><section><div class="card hero"><div class="m">CURRENT PICK ${s.pick} / 60 • ${esc(current())}</div><h2>${b?esc(b.p[0]):'No projected player available'}</h2><span class="pill">${b?.p[1]||''}</span><div class="big">${b?b.score.toFixed(0):'—'}</div><div class="m">DRAFTIQ SCORE</div><p>${b?why(b):'Add more projection data or import a current projection file.'}</p>${b&&level(b.p[0])>=3?'<div class="alert">🚨 MUST-HAVE TARGET</div>':''}<div class="actions">${b&&current()==='Scott'?`<button class="go" onclick="draft('${esc(b.p[0])}')">DRAFT ${esc(b.p[0])}</button>`:''}<button onclick="advance()">Advance Pick</button></div></div><div class="three"><div class="stat">Available<b>${avail().length}</b></div><div class="stat">Next Scott Pick<b>${nextMine()||'—'}</b></div><div class="stat">Picks Away<b>${gap()}</b></div></div><div class="card"><h3>🔥 Suggested Players</h3>${r.slice(0,10).map(suggestion).join('')}</div></section><aside><div class="card"><h3>🔮 Likely Around Your Next Pick</h3><div class="notice">Survival updates as you record real picks and trades.</div>${r.slice().sort((a,b)=>b.surv-a.surv).slice(0,6).map(x=>`<div class="row"><span><b>${esc(x.p[0])}</b><br><span class="m mini">${x.p[1]} • ${x.pts.toFixed(1)} pts</span></span><b class="${x.surv<35?'bad':x.surv<65?'warn':'good'}">${x.surv}%</b></div>`).join('')}</div><div class="card"><h3>🎯 Targets</h3>${s.targets.length?s.targets.map(t=>`<div class="row"><span><b>${esc(t.name)}</b><br><span class="m">${['','Watch','Target','Must Have'][t.level]}</span></span><button class="red" onclick="delTarget('${esc(t.name)}')">×</button></div>`).join(''):'<span class="m">None yet.</span>'}</div></aside></div>`}
function why(x){return level(x.p[0])>=3?'Must-have target.':x.surv<35?`Only ${x.surv}% estimated to survive your next Scott pick.`:need(x.p[1])>70?`Strong roster fit at ${x.p[1]}.`:`Best blend of projected points, roster fit and urgency.`}
function draft(n){if(current()!=='Scott')return;let p=data(n);s.draft.push({pick:s.pick,team:'Scott',name:n,pos:p[1]});advance();save();view('draft')}function advance(){s.pick=Math.min(60,s.pick+1);save();view('draft')}
function board(){return `<div class="card"><h2>📋 Draft Board</h2><div class="notice">Your picks are <b>1.01, 1.09, 2.09, 4.09, 5.09 and 6.09</b>. You do not have 3.09. Pick ownership can be swapped below.</div><table><tr><th>Pick</th><th>Team</th><th>Player</th><th>Pos</th></tr>${Array.from({length:60},(_,i)=>{let p=i+1,d=s.draft.find(x=>x.pick===p);return `<tr ${owner(p)==='Scott'?'style="background:#132b28"':''}><td>${Math.ceil(p/10)}.${String((p-1)%10+1).padStart(2,'0')}</td><td>${esc(owner(p))}</td><td>${d?esc(d.name):'<span class="m">—</span>'}</td><td>${d?d.pos:'—'}</td></tr>`}).join('')}</table></div><div class="card"><h3>🔄 Swap / Trade Picks</h3><div class="notice">Select two picks to exchange their ownership. This changes who DraftIQ expects to make future picks.</div><div class="three"><select id="pa">${pickOptions()}</select><select id="pb">${pickOptions()}</select><button class="go" onclick="swapPicks()">SWAP OWNERS</button></div><div class="actions"><button onclick="undo()">↩ Undo Last Pick</button></div></div>`}
function pickOptions(){return Array.from({length:60},(_,i)=>`<option value="${i+1}">${Math.ceil((i+1)/10)}.${String(i%10+1).padStart(2,'0')} — ${esc(owner(i+1))}</option>`).join('')}function swapPicks(){let a=+$('pa').value,b=+$('pb').value;if(a===b)return;let oa=owner(a),ob=owner(b);s.pickOwners[a]=ob;s.pickOwners[b]=oa;s.trades.push({a,b,from:oa,to:ob});save();view('board')}function undo(){let d=s.draft.pop();if(d)s.pick=d.pick;save();view('board')}
function players(){return `<div class="card"><h2>Available Players</h2><div class="notice">Green = true 2026 projection loaded. Players without a verified projection are shown but not ranked by DraftIQ yet.</div><div class="filters"><input id="q" placeholder="Search" oninput="filterPlayers()"><select id="po" onchange="filterPlayers()"><option value="">All</option><option>QB</option><option>RB</option><option>WR</option><option>TE</option></select></div><div id="plist"></div></div>`}function filterPlayers(){if(!$('plist'))return;let q=($('q')?.value||'').toLowerCase(),po=$('po')?.value||'';let a=avail().filter(p=>(!q||p[0].toLowerCase().includes(q))&&(!po||p[1]===po));$('plist').innerHTML=`<table><tr><th>Player</th><th>Pos</th><th>2026 pts</th><th>Next</th></tr>${a.map(p=>`<tr><td>${esc(p[0])}</td><td>${p[1]}</td><td>${pts(p[0])==null?'<span class="m">Not loaded</span>':pts(p[0]).toFixed(1)}</td><td>${pts(p[0])==null?'—':survival(p[0])+'%'}</td></tr>`).join('')}</table>`}
function targets(){return `<div class="grid"><div class="card"><h2>🎯 My Targets</h2>${s.targets.length?s.targets.map(t=>`<div class="row"><span><b>${esc(t.name)}</b><br><span class="m">${['','Watch','Target','Must Have'][t.level]}</span></span><button class="red" onclick="delTarget('${esc(t.name)}')">Remove</button></div>`).join(''):'<span class="m">No targets yet.</span>'}</div><div class="card"><h3>Add Target</h3><select id="tn">${avail().map(p=>`<option>${esc(p[0])}</option>`).join('')}</select><select id="tl" style="margin-top:8px"><option value="1">Watch</option><option value="2">Target</option><option value="3">Must Have</option></select><button class="go" style="margin-top:8px" onclick="addTarget()">Add</button></div></div>`}function addTarget(){let n=$('tn').value,l=+$('tl').value;s.targets=s.targets.filter(x=>x.name!==n);s.targets.push({name:n,level:l});save();view('targets')}function delTarget(n){s.targets=s.targets.filter(x=>x.name!==n);save();view('targets')}
function roster(){return `<div class="grid"><div class="card"><h2>👤 Scott</h2>${my().map(x=>`<div class="row"><span><b>${esc(x.name)}</b><br><span class="m">${x.pos}</span></span>${x.keeper?'<span class="pill">KEEPER</span>':''}</div>`).join('')}</div><div class="card"><h3>Roster strategy</h3><div class="notice">Josh Allen, Jahmyr Gibbs, Ashton Jeanty and Justin Jefferson are locked in as keepers. DraftIQ therefore prioritizes additional WR/RB/flex value rather than treating QB as an early need.</div></div></div>`}
function league(){return `<div class="card"><h2>⚙️ League & Pick Trades</h2><div class="notice"><b>10 teams • 6 rounds • non-snake</b><br>Roster: QB, WR, WR, WR, RB, RB, W/R/T, W/R/T, Q/W/R/T, DEF, 5 BN, 2 IR.<br>Scott's original draft slot is 9 every round; 3.09 is traded away; 1.01 is acquired.</div><h3>Keepers</h3><table><tr><th>Team</th><th>Keepers</th></tr>${s.teams.map(t=>`<tr><td><b>${esc(t[0])}</b></td><td>${t.slice(1).filter(Boolean).map(esc).join(', ')||'<span class="m">Pending</span>'}</td></tr>`).join('')}</table><h3 style="margin-top:18px">Pick ownership</h3><table><tr><th>Round</th><th>Scott picks</th></tr>${[1,2,3,4,5,6].map(r=>`<tr><td>${r}</td><td>${Array.from({length:10},(_,i)=>r*10-9+i).filter(p=>owner(p)==='Scott').map(p=>`${r}.${String(p%10||10).padStart(2,'0')}`).join(', ')||'None'}</td></tr>`).join('')}</table><h3 style="margin-top:18px">2026 projection source</h3><div class="notice">DraftIQ uses 2026 consensus projection inputs from FantasyPros, with the projection tables last updated Aug. 23–25, 2026. DraftIQ recalculates those projected stats using your league's 25-yard passing/rushing/receiving yardage rules, 6-point TDs, PPR, INT/fumble penalties and other custom scoring.</div><div class="actions"><button onclick="resetDraft()">Reset Draft Picks</button></div></div>`}function resetDraft(){if(confirm('Reset all recorded draft picks and trade ownership changes?')){s.draft=[];s.pick=1;s.pickOwners={1:'Scott',9:'Scott',19:'Scott',39:'Scott',49:'Scott',59:'Scott'};s.trades=[];save();view('league')}}view('draft');
</script></body></html>
